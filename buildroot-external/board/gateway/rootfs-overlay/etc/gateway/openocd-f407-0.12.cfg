# Template for OpenOCD 0.12.0. Not tested on the new hardware.
# Sources: official OpenOCD v0.12.0 interface/stlink.cfg and stm32f4discovery.cfg.
# This bring-up wiring has SWD but no external NRST connection.
bindto 127.0.0.1
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 1000
set WORKAREASIZE 0x10000
source [find target/stm32f4x.cfg]
reset_config none
cortex_m reset_config sysresetreq
gdb_port 3333
tcl_port 6666
telnet_port 4444
